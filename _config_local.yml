baseurl: ""
url: "http://localhost:4000"
# Prevent Jekyll from wiping the symlink during builds
keep_files:
  - assets/images
exclude:
  - _config_cdn.yml
  - _config_gh.yml
  - _config_local.yml
  - AGENTS.md
  - README.md
  - LICENSE.md
  - .bundle
  - .devcontainer
  - .github
  - .obsidian
  - .sass-cache
  - .jekyll-cache
  - .gitignore
  - _site
  - "*.swp"
  - ".DS_Store"
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle
  - vendor/cache
  - vendor/gems
  - vendor/ruby
  - script/
  - vault
  - Makefile
  - build.sh
  - scripts/
  - GEMINI.md
  - CHECK.md
  - QUOTE.md
  - BUFF-CHECK.md
  - docs
  - assets/images
